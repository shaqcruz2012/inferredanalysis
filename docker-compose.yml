version: "3.9"

services:
  landing-page:
    build: ./services/landing-page
    ports:
      - "3000:3000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  url-summarizer:
    build: ./services/url-summarizer
    ports:
      - "9003:9003"
    env_file: .env
    restart: unless-stopped
    depends_on:
      landing-page:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9003/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  x402-api:
    build: ./services/x402-api
    ports:
      - "9402:9402"
    env_file: .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9402/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  invoice-parser:
    build:
      context: .
      dockerfile: app/Dockerfile
    ports:
      - "8000:8000"
    env_file: .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\" || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  gateway:
    build:
      context: .
      dockerfile: src/gateway/Dockerfile
    ports:
      - "7402:7402"
    env_file: .env
    restart: unless-stopped
    depends_on:
      url-summarizer:
        condition: service_healthy
      x402-api:
        condition: service_healthy
      invoice-parser:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:7402/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      gateway:
        condition: service_healthy
      landing-page:
        condition: service_healthy
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
